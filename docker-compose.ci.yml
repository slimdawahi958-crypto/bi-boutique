services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bi_boutique
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  backend:
    image: ${BACKEND_IMAGE}
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_NAME: bi_boutique
      DB_PASSWORD: postgres
    depends_on:
      - db
    ports:
      - "${API_PORT}:5000"
  frontend:
    image: ${FRONTEND_IMAGE}
    depends_on:
      - backend
    ports:
      - "${WEB_PORT}:80"
