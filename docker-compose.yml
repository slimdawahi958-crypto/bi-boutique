version: "3.8"

services:
  # 1. Base de données
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bi_boutique
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12919751 # Le mot de passe de la base
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Backend (Node.js)
  backend:
    image: bi-boutique-backend:latest
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      # On injecte les variables d'environnement pour que server.js les utilise
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=12919751
      - DB_NAME=bi_boutique

  # 3. Frontend (React/Nginx)
  frontend:
    image: bi-boutique-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
